<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Հայկական Բանկային Օգնական</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-card: #111827;
            --border: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.25);
            --danger: #ef4444;
            --success: #22c55e;
            --success-bg: rgba(34, 197, 94, 0.1);
            --success-border: rgba(34, 197, 94, 0.3);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; overflow: hidden;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none;
        }
        .card {
            position: relative; width: 460px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 20px;
            padding: 48px 40px 40px; text-align: center;
            box-shadow: 0 4px 40px rgba(0,0,0,0.4);
        }
        .card::before {
            content: ''; position: absolute; top: -1px; left: -1px; right: -1px; height: 3px;
            background: linear-gradient(90deg, var(--accent), #8b5cf6, var(--accent));
            border-radius: 20px 20px 0 0;
        }
        .banks { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; }
        .bank-badge {
            font-size: 11px; font-weight: 600; letter-spacing: 0.5px; padding: 6px 14px;
            border-radius: 100px; background: rgba(59,130,246,0.08);
            border: 1px solid rgba(59,130,246,0.15); color: var(--text-secondary);
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }
        .orb-wrapper { position: relative; width: 140px; height: 140px; margin: 0 auto 32px; }
        .orb-bg {
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            transition: all 0.5s ease;
        }
        .orb-wrapper.active .orb-bg {
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 70%);
            animation: pulse-bg 2s ease-in-out infinite;
        }
        .orb {
            position: absolute; inset: 20px; border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--border); display: flex;
            align-items: center; justify-content: center; transition: all 0.4s ease;
        }
        .orb-wrapper.active .orb {
            border-color: var(--accent);
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 20px rgba(59,130,246,0.05);
        }
        .orb-icon { width: 36px; height: 36px; color: var(--text-muted); transition: color 0.4s ease; }
        .orb-wrapper.active .orb-icon { color: var(--accent); }
        .wave-bars { display: none; gap: 3px; align-items: center; height: 36px; }
        .orb-wrapper.speaking .wave-bars { display: flex; }
        .orb-wrapper.speaking .orb-icon { display: none; }
        .wave-bar { width: 4px; border-radius: 4px; background: var(--accent); animation: wave 1s ease-in-out infinite; }
        .wave-bar:nth-child(1) { height: 12px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 28px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 12px; animation-delay: 0.4s; }
        .status-bar {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 500;
            margin-bottom: 28px; background: rgba(100,116,139,0.1);
            border: 1px solid rgba(100,116,139,0.15); color: var(--text-secondary);
            transition: all 0.3s ease;
        }
        .status-bar.connected { background: var(--success-bg); border-color: var(--success-border); color: var(--success); }
        .status-bar.error { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--danger); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
        .status-bar.connected .status-dot { background: var(--success); animation: blink 2s ease-in-out infinite; }
        .status-bar.error .status-dot { background: var(--danger); }
        .btn-group { display: flex; gap: 12px; justify-content: center; }
        .btn {
            padding: 12px 32px; font-size: 14px; font-weight: 600; font-family: inherit;
            border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 2px 12px var(--accent-glow); }
        .btn-primary:hover { background: var(--accent-hover); box-shadow: 0 4px 20px var(--accent-glow); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; transform: none; }
        .btn-danger { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
        .btn-danger:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); }
        .btn-mute { background: rgba(100,116,139,0.1); color: var(--text-secondary); border: 1px solid rgba(100,116,139,0.2); padding: 12px 16px; }
        .btn-mute:hover { background: rgba(100,116,139,0.2); }
        .btn-mute.muted { background: rgba(239,68,68,0.1); color: var(--danger); border-color: rgba(239,68,68,0.2); }
        .btn-icon { width: 18px; height: 18px; }
        .footer { margin-top: 24px; font-size: 11px; color: var(--text-muted); letter-spacing: 0.3px; }
        @keyframes pulse-bg { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.7; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes wave { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
        .connected-controls { display: none; }
        .connected-controls.visible { display: flex; }
        #audioContainer { position: absolute; width: 0; height: 0; overflow: hidden; }
    </style>
</head>
<body>
    <div class="card">
        <div class="banks">
            <span class="bank-badge">Արդշինբանկ</span>
            <span class="bank-badge">Արցախբանկ</span>
            <span class="bank-badge">Մելլաթ Բանկ</span>
        </div>
        <h1>Բանկային Ձայնային Օգնական</h1>
        <p class="subtitle">Հայկական բանկերի AI-ով աջակցված ձայնային օգնական</p>
        <div class="orb-wrapper" id="orb">
            <div class="orb-bg"></div>
            <div class="orb">
                <svg class="orb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                <div class="wave-bars"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
            </div>
        </div>
        <div class="status-bar" id="status">
            <span class="status-dot"></span>
            <span id="statusText">Սեղմեք Միանալը սկսելու համար</span>
        </div>
        <div class="btn-group" id="disconnectedControls">
            <button class="btn btn-primary" id="connectBtn" onclick="toggleConnection()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
                Սկսել զրույցը
            </button>
        </div>
        <div class="btn-group connected-controls" id="connectedControls">
            <button class="btn btn-mute" id="muteBtn" onclick="toggleMute()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>
                </svg>
            </button>
            <button class="btn btn-danger" onclick="toggleConnection()">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
                    <line x1="1" x2="23" y1="1" y2="23"/>
                </svg>
                Ավարտել զանգը
            </button>
        </div>
        <div class="footer">Աշխատում է LiveKit և Google Gemini հարթակով</div>
        <div id="audioContainer"></div>
    </div>
    <script>
        const LIVEKIT_URL = 'ws://localhost:7880';
        const STR = {"title": "Հայկական Բանկային Ձայնային Օգնական", "h1": "Բանկային Ձայնային Օգնական", "subtitle": "Հայկական բանկերի AI-ով աջակցված ձայնային օգնական", "bank1": "Արդշինբանկ", "bank2": "Արցախբանկ", "bank3": "Մելլաթ Բանկ", "ready": "Սեղմեք Միանալը սկսելու համար", "start": "Սկսել զրույցը", "end": "Ավարտել զանգը", "footer": "Աշխատում է LiveKit և Google Gemini հարթակով", "connecting_btn": "Միանում է...", "connecting_status": "Միանում է սերվերին...", "connected": "Միացված է — խոսեք հայերենով", "disconnected": "Անջատված", "error": "Միանման սխալ — ", "muted": "Միկրոֆոնը անջատված է"};
        let room = null, connected = false, muted = false;

        const orb = document.getElementById('orb');
        const statusBar = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectedControls = document.getElementById('disconnectedControls');
        const connectedControls = document.getElementById('connectedControls');
        const muteBtn = document.getElementById('muteBtn');

        const micSvg = '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>';
        const micOffSvg = '<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="22" y1="2" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/><path d="M5 10v2a7 7 0 0 0 12 5"/><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12"/><line x1="12" x2="12" y1="19" y2="22"/></svg>';

        async function getToken() {
            const resp = await fetch('http://localhost:8081/token');
            return (await resp.json()).token;
        }

        function setStatus(text, type) {
            statusText.textContent = text;
            statusBar.className = 'status-bar' + (type ? ' ' + type : '');
        }

        function setUI(state) {
            if (state === 'connected') {
                disconnectedControls.style.display = 'none';
                connectedControls.classList.add('visible');
                orb.classList.add('active');
            } else {
                disconnectedControls.style.display = 'flex';
                connectedControls.classList.remove('visible');
                orb.classList.remove('active', 'speaking');
            }
        }

        async function toggleConnection() {
            if (connected) await disconnect(); else await connectToRoom();
        }

        async function connectToRoom() {
            connectBtn.disabled = true;
            connectBtn.innerHTML = '<span class="spinner"></span> ' + STR.connecting_btn;
            setStatus(STR.connecting_status, '');
            try {
                const token = await getToken();
                room = new LivekitClient.Room({
                    audioCaptureDefaults: { autoGainControl: true, noiseSuppression: true, echoCancellation: true },
                });
                room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                    if (track.kind === 'audio') {
                        document.getElementById('audioContainer').appendChild(track.attach());
                        orb.classList.add('speaking');
                    }
                });
                room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                    track.detach().forEach(el => el.remove());
                    orb.classList.remove('speaking');
                });
                room.on(LivekitClient.RoomEvent.Disconnected, () => {
                    connected = false; muted = false;
                    setStatus(STR.disconnected, '');
                    setUI('disconnected');
                    connectBtn.disabled = false;
                    connectBtn.innerHTML = micSvg + ' ' + STR.start;
                });
                room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, (speakers) => {
                    if (speakers.some(s => s.identity !== 'user')) orb.classList.add('speaking');
                    else orb.classList.remove('speaking');
                });
                await room.connect(LIVEKIT_URL, token);
                await room.localParticipant.setMicrophoneEnabled(true);
                connected = true;
                setStatus(STR.connected, 'connected');
                setUI('connected');
            } catch (err) {
                console.error(err);
                setStatus(STR.error + err.message, 'error');
                setUI('disconnected');
                connectBtn.disabled = false;
                connectBtn.innerHTML = micSvg + ' ' + STR.start;
            }
        }

        async function disconnect() {
            if (room) { await room.disconnect(); room = null; }
            connected = false; muted = false;
            setStatus(STR.ready, '');
            setUI('disconnected');
        }

        async function toggleMute() {
            if (!room) return;
            muted = !muted;
            await room.localParticipant.setMicrophoneEnabled(!muted);
            muteBtn.classList.toggle('muted', muted);
            muteBtn.innerHTML = muted ? micOffSvg : micSvg;
            setStatus(muted ? STR.muted : STR.connected, muted ? '' : 'connected');
        }
    </script>
</body>
</html>
